[global]
# Streamlit turns this on when it is not installed into site-packages, and then
# refuses server.port. The program is a local app, not a Streamlit checkout.
developmentMode = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
port = 8517

[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#F4F1EB"
secondaryBackgroundColor = "#E7E1D6"
textColor = "#1C2833"
font = "sans serif"
